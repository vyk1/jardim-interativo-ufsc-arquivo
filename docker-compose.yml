services:
  apx:
    build: .
    container_name: jardim-app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
    stdin_open: true

  # CLI do Firebase (deploy do Hosting) — precisa de Node >=20, por isso vive
  # num serviço separado do "app" (que fica preso no Node 12 do projeto).
  fb:
    build:
      context: .
      dockerfile: Dockerfile.firebase
    volumes:
      - .:/app
      - firebase-config:/root/.config
    stdin_open: true
    tty: true

volumes:
  firebase-config:
